services:
  - type: web
    name: finance-research-dashboard
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:server --worker-class gthread --workers 1 --threads 8 --timeout 60 --bind 0.0.0.0:$PORT
    envVars:
      - key: DASHBOARD_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: 3.11.14
